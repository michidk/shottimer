name: Housing CAD

on:
  push:
    branches: [main]
    paths:
      - 'housing/**'
      - '.github/workflows/housing.yml'
  pull_request:
    paths:
      - 'housing/**'
      - '.github/workflows/housing.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch builds can stop; artifacts belong to individual runs.
concurrency:
  group: housing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: housing
    env:
      PYOPENGL_PLATFORM: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          enable-cache: true
          cache-dependency-glob: |
            housing/uv.lock
      - name: Install rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libglu1-mesa fonts-dejavu-core
      - name: Install CAD dependencies
        run: |
          uv sync --locked --python 3.12
      - name: Build and validate RP2040-LCD-1.28 desktop stand
        run: .venv/bin/python build.py stand
      - name: Build and validate RP2040-LCD-1.28 magnetic housing
        run: .venv/bin/python build.py magnetic --usb left --magnet right
      - name: Collect both housings with PCB and variant names
        run: .venv/bin/python prepare_artifact.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: housing
          path: housing/output/artifact/
          if-no-files-found: error
          retention-days: 90
