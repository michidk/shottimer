name: Housing CAD

on:
  push:
    branches: [main]
    paths:
      - 'housing/**'
      - '.github/workflows/housing.yml'
  pull_request:
    paths:
      - 'housing/**'
      - '.github/workflows/housing.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch builds can stop; artifacts belong to individual runs.
concurrency:
  group: housing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: housing
    env:
      PYOPENGL_PLATFORM: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.22'
          enable-cache: true
          cache-dependency-glob: |
            housing/requirements.txt
            housing/overrides.txt
      - name: Install rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libglu1-mesa fonts-dejavu-core
      - name: Install CAD dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt --override overrides.txt
      - name: Check assembly and insertion paths
        run: .venv/bin/python usb_centered_stand.py
      - name: Check USB access and export printable files
        run: .venv/bin/python finish_usb_centered.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: housing
          path: |
            housing/output/usb-centered/body.stl
            housing/output/usb-centered/cover_print.stl
            housing/output/usb-centered/assembly.step
          if-no-files-found: error
          retention-days: 90
