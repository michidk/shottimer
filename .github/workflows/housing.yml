name: Housing CAD

on:
  push:
    branches: [main]
    paths:
      - 'housing/**'
      - '.github/workflows/housing.yml'
  pull_request:
    paths:
      - 'housing/**'
      - '.github/workflows/housing.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch builds can stop; artifacts belong to individual runs.
concurrency:
  group: housing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: housing
    env:
      PYOPENGL_PLATFORM: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: |
            housing/requirements.txt
            housing/overrides.txt
      - name: Install rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libglu1-mesa fonts-dejavu-core
      - name: Install CAD dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt --override overrides.txt
      - name: Build and validate RP2040-LCD-1.28 desktop stand
        run: .venv/bin/python build.py stand
      - name: Build and validate RP2040-LCD-1.28 magnetic housing
        run: .venv/bin/python build.py magnetic --usb left --magnet right
      - name: Collect both housings with PCB and variant names
        run: .venv/bin/python prepare_artifact.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: housing
          path: housing/output/artifact/
          if-no-files-found: error
          retention-days: 90
